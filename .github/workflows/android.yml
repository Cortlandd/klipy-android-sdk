name: Android

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      KLIPY_API_KEY: dummy

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify the SDK and sample apps
        run: ./gradlew :klipy:test :klipy:assembleRelease :klipy-ui:assembleRelease :app:compileDebugKotlin :demo:compileDebugKotlin
